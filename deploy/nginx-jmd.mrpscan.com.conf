# Paste these two blocks inside the existing `server { ... }` for
# jmd.mrpscan.com (the HTTPS one, listen 443), replacing whatever `location /`
# serves the old static index.html today. Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# local_server.py serves the dashboard, /api, /api/3min and /ws itself on
# 127.0.0.1:7005, so nginx only has to pass everything through - and let the
# /ws request upgrade to a WebSocket.

    location /ws {
        proxy_pass http://127.0.0.1:7005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The server heartbeats every 20s; this only bounds a truly dead socket.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

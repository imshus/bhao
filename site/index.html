<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Rate Tracker | Live Rates</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Gold Rate Tracker</h1>
</header>

<div class="meta">
  <span id="updated"><span class="conn-dot connecting"></span>Connecting…</span>
  <button id="refresh">Refresh</button>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer id="footnote">Connecting…</footer>

<script>
// Where a copy of this page that is not served by local_server.py (the S3
// page, a file:// copy) reads its JSON: the live server at jmd.mrpscan.com.
// The old API Gateway endpoint is no longer used anywhere.
const REMOTE_API_URL = "https://jmd.mrpscan.com/api";

// Deployed WebSocket endpoint. deploy.sh rewrites this literal too, once the
// WebSocket API exists; until then it still says PLACEHOLDER and we just poll.
const REMOTE_WS_URL = "wss://WEBSOCKET_ENDPOINT_PLACEHOLDER";

const IS_LOCAL = ["localhost", "127.0.0.1", "0.0.0.0", "[::1]"].includes(location.hostname);
const IS_HTTP = location.protocol === "http:" || location.protocol === "https:";
const PARAMS = new URLSearchParams(location.search);

// WebSocket target: /ws on this same origin - local_server.py, run directly
// or behind nginx (see deploy/), which is what makes jmd.mrpscan.com push
// live. If the socket can't be had, the page polls the dealers itself
// (direct mode) so the numbers never freeze. ?direct skips the socket.
//
// The API Gateway socket (deploy.sh's S3 page) is opt-in with ?ws: it only
// pushes while a 15-minute stream Lambda happens to be running and starts
// from a DynamoDB snapshot up to 30 min old, so by default the S3 page
// stays on direct mode, which is live every 0.5s.
const SAME_ORIGIN_WS = IS_HTTP
  ? (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
  : null;
const WS_URL = PARAMS.has("direct") ? null
  : (PARAMS.has("ws") && !IS_LOCAL && REMOTE_WS_URL.indexOf("PLACEHOLDER") === -1) ? REMOTE_WS_URL
  : SAME_ORIGIN_WS;
// /api lives next to /ws when local_server.py is the host.
const API_URL = (IS_LOCAL || (WS_URL !== null && WS_URL === SAME_ORIGIN_WS)) ? "/api" : REMOTE_API_URL;

const POLL_MS = 30000;
const FLASH_MS = 900;

function fmt(v) {
  if (v === null || v === undefined || v === "" || v === "-") return "—";
  const str = String(v).trim();
  const n = Number(str);
  if (Number.isNaN(n)) return str;
  // Keep their decimals exactly as published: 95.740 must not become 95.74.
  const dot = str.indexOf(".");
  const decimals = dot === -1 ? 0 : str.length - dot - 1;
  return n.toLocaleString("en-IN", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals,
  });
}

function fmtSigned(v) {
  if (v === null || v === undefined || v === "-" || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return (n > 0 ? "+" : "") + n.toLocaleString("en-IN");
}

// Feed text is third-party: escape it before it goes into innerHTML.
function esc(v) {
  return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function numOrNull(v) {
  if (v === null || v === undefined || v === "" || v === "-") return null;
  const n = Number(v);
  return Number.isNaN(n) ? null : n;
}

function ago(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return "";
  const secs = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (secs < 60) return secs + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  return Math.floor(secs / 3600) + "h ago";
}

// ---- cards are created once, then patched in place ----------------------
// A full grid rebuild would throw away the DOM on every push, killing the
// flash animation and any text selection. Each dealer now arrives on its own
// schedule, so cards are keyed by source id and updated individually.

const cards = new Map();   // source id -> {el, values:{}, record}

function createCard(src) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.source = src.source;
  // Same order whichever transport (or dealer) answers first.
  const order = DIRECT_SOURCES.findIndex(s => s.id === src.source);
  el.style.order = order === -1 ? DIRECT_SOURCES.length : order;

  const rowsHtml = src.rows.map((r, i) =>
    `<tr>
       <td class="label" data-note="row${i}">${esc(r.label)}</td>
       <td class="num buy" data-cell="row${i}.buy">—</td>
       <td class="num sell" data-cell="row${i}.sell">—</td>
       <td class="num hl" data-cell="row${i}.high">—</td>
       <td class="num hl" data-cell="row${i}.low">—</td>
     </tr>`).join("");

  el.innerHTML = `
    <h2>
      <a href="${esc(src.site_url)}" target="_blank" rel="noopener">${esc(src.name)}</a>
      <span class="sub">
        <span class="card-dot"></span>
        <span class="card-when">—</span>
        <span class="card-badge"></span>
      </span>
    </h2>
    <div class="table-wrap">
      <table class="rates">
        <thead><tr><th>Product</th><th>Buy</th><th>Sell</th><th>High</th><th>Low</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div class="badla-row">
      <div class="badla-title">Badla Bhaw</div>
      <div class="badla-items">
        <div class="badla-item">
          <div class="badla-item-label">Cash</div>
          <div class="badla-item-value" data-cell="diff1">—</div>
        </div>
        <div class="badla-item">
          <div class="badla-item-label">RTGS</div>
          <div class="badla-item-value" data-cell="diff2">—</div>
        </div>
      </div>
    </div>
    <details class="all-rows" open>
      <summary></summary>
      <div class="table-wrap">
        <table class="rates feed-all">
          <thead><tr><th>Feed row</th><th>Buy</th><th>Sell</th><th>High</th><th>Low</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  `;
  document.getElementById("grid").appendChild(el);
  return { el, values: {}, record: src, allRowKey: "" };
}

// The raw feed table is rebuilt only when the set of rows changes - a dealer
// can add or drop a row mid-session (Mega Bullion gains its 99.50 rows the
// moment credentials resolve a customer template).
function syncAllRows(card, src) {
  const rows = src.all_rows || [];
  const key = rows.map(r => r.id + ":" + r.label).join("|");
  const details = card.el.querySelector(".all-rows");
  if (!details) return;

  details.style.display = rows.length ? "" : "none";
  if (key === card.allRowKey) return;
  card.allRowKey = key;

  details.querySelector("summary").textContent =
    "All " + rows.length + " rates published by this dealer";
  details.querySelector("tbody").innerHTML = rows.map(r =>
    `<tr>
       <td class="label"><span class="row-id">${esc(r.id)}</span>${esc(r.label)}</td>
       <td class="num buy" data-cell="all.${esc(r.id)}.buy">—</td>
       <td class="num sell" data-cell="all.${esc(r.id)}.sell">—</td>
       <td class="num hl" data-cell="all.${esc(r.id)}.high">—</td>
       <td class="num hl" data-cell="all.${esc(r.id)}.low">—</td>
     </tr>`).join("");
}

// A blank cell should say which kind of blank it is: a dealer that doesn't
// publish the product at all, a login-only row, or no buy-back price.
function setNote(card, key, note) {
  const el = card.el.querySelector(`[data-note="${CSS.escape(key)}"]`);
  if (!el) return;
  el.classList.toggle("has-note", !!note);
  el.title = note || "";
}

function setCell(card, key, text, value) {
  const cell = card.el.querySelector(`[data-cell="${CSS.escape(key)}"]`);
  if (!cell) return;

  const isBlank = text === "—";
  cell.textContent = text;
  cell.classList.toggle("na", isBlank);

  const before = card.values[key];
  card.values[key] = value;
  if (before === undefined || value === null || before === null || value === before) return;

  // Flash green when it ticks up, red when it ticks down.
  const dir = value > before ? "flash-up" : "flash-down";
  cell.classList.remove("flash-up", "flash-down");
  void cell.offsetWidth;            // restart the animation if it re-fires
  cell.classList.add(dir);
  setTimeout(() => cell.classList.remove(dir), FLASH_MS);
}

function applyRecord(src) {
  let card = cards.get(src.source);
  if (!card) {
    card = createCard(src);
    cards.set(src.source, card);
  }
  card.record = src;

  const COLUMNS = ["buy", "sell", "high", "low"];

  src.rows.forEach((r, i) => {
    COLUMNS.forEach(col => setCell(card, "row" + i + "." + col, fmt(r[col]), numOrNull(r[col])));
    setNote(card, "row" + i, r.note);
  });

  syncAllRows(card, src);
  (src.all_rows || []).forEach(r => {
    COLUMNS.forEach(col => setCell(card, "all." + r.id + "." + col, fmt(r[col]), numOrNull(r[col])));
  });

  setCell(card, "diff1", fmtSigned(src.diff1), numOrNull(src.diff1));
  setCell(card, "diff2", fmtSigned(src.diff2), numOrNull(src.diff2));

  const offline = src.ok === false;
  card.el.classList.toggle("offline", offline);
  const badge = card.el.querySelector(".card-badge");
  badge.textContent = offline ? "not responding" : "";
  badge.title = offline ? (src.error || "") : "";

  paintCardTime(card);
}

function paintCardTime(card) {
  const src = card.record;
  const when = src.changed_at || src.timestamp;
  const label = card.el.querySelector(".card-when");
  if (!label) return;
  label.textContent = "Updated " + ago(when);
  label.title = new Date(when).toLocaleTimeString("en-IN");
}

// Keeps the "3s ago" labels honest between pushes.
setInterval(() => cards.forEach(paintCardTime), 1000);

function render(sources) {
  sources.forEach(applyRecord);
  paintStatus();
}

// transport: "connecting" | "ws" (server push) | "direct" (browser polls the
// dealers) | "poll" (/api every 30s - local_server --dynamo only)
let transport = "connecting";

const STATUS = {
  connecting: ["connecting", () => "Connecting…",
               "Connecting…"],
  ws:         ["live", () => "Live · " + cards.size + " dealers streaming",
               "WebSocket: the server polls each dealer and pushes a card the moment its rate moves."],
  direct:     ["live", () => "Live · " + cards.size + " dealers (direct)",
               "WebSocket unavailable - this browser is polling each dealer every 0.5s instead."],
  poll:       ["polling", () => "Last refreshed " + new Date().toLocaleTimeString("en-IN"),
               "Polling for updates every 30 seconds."],
};

function paintStatus() {
  const [dot, text, foot] = STATUS[transport];
  document.getElementById("updated").innerHTML =
    `<span class="conn-dot ${dot}"></span>` + text();
  document.getElementById("footnote").textContent = foot;
  document.getElementById("refresh").style.display = transport === "poll" ? "" : "none";
}

async function load() {
  try {
    const res = await fetch(API_URL);
    render(await res.json());
  } catch (e) {
    document.getElementById("updated").innerHTML =
      '<span class="conn-dot offline"></span>Failed to load data';
  }
}

// ---- direct mode: the browser polls the dealer feeds itself -------------
// Every feed sends Access-Control-Allow-Origin: *, which is how the dealers'
// own LiveRates pages work. Off localhost this needs no WebSocket and no
// Lambda: each dealer is fetched every DIRECT_MS on its own clock. Mirrors
// SOURCES / build_source_record in lambda_fetch/lambda_function.py. Mega
// Bullion's login-only 99.50 rows can't be fetched here (no credentials in
// the browser), so they stay blank as on the public feed.

const DIRECT_MS = 500;
const CANONICAL_LABELS = ["Gold Future MCX", "99.50 Gold Cash", "99.50 Gold RTGS"];
const FEED = "https://bcast.%s:7768/VOTSBroadcastStreaming/Services/xml/GetLiveRateByTemplateID/";
const DIRECT_SOURCES = [
  { id: "jmd_patil", name: "JMD Patil", site_url: "https://jmdpatil.com/LiveRates.html",
    url: FEED.replace("%s", "jmdpatil.com") + "jmd",
    rows: [{ label: "GOLD FUTURE" }, { label: "99.50 GOLD" }, { label: "99.50 GOLD (RTGS)" }] },
  { id: "mega_bullion", name: "Mega Bullion", site_url: "https://megabullion.info/LiveRates.html",
    url: FEED.replace("%s", "megabullion.info") + "mega",
    rows: [{ label: "GOLD FUTURE" },
           { split: true, buy_label: "GOLD 99.50 LIVALI", sell_label: "GOLD 99.50 SELL" },
           { label: "GOLD 99.50 RTGS", sell_col: 3 }] },
  { id: "shri_sai", name: "Shri Sai Jewels", site_url: "http://www.shrisaijewels.in/",
    url: FEED.replace("%s", "shrisaijewels.in") + "sai",
    rows: [{ label: "GOLD FUTURE" }, null, { label: "Gold 9950 RTGS" }] },
  { id: "shri_ganesh", name: "Shri Ganesh Bullion", site_url: "https://shriganeshbullion.com/",
    url: FEED.replace("%s", "shriganeshbullion.com") + "shriganeshbullion",
    rows: [{ label: "GOLD COSTING" }, null, null] },
];

function parseFeed(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    const parts = line.split("\t").map(p => p.trim());
    while (parts.length && parts[0] === "") parts.shift();
    while (parts.length && parts[parts.length - 1] === "") parts.pop();
    if (parts.length < 6) return;
    const [id, label, buy, sell, high, low] = parts;
    out.push({ id, label, buy, sell, high, low });
  });
  return out;
}

function toInt(s) {
  return typeof s === "string" && /^-?\d+$/.test(s.trim()) ? parseInt(s, 10) : null;
}

function rowNote(source, cfg, cells) {
  if (cfg === null) return "This dealer does not publish this category";
  if (cells.sell === null && cells.buy === null) {
    return source.id === "mega_bullion"
      ? "Published only on this dealer's customer template"
      : "Row not present in the dealer's feed right now";
  }
  if (cells.buy === null || cells.buy === "-" || cells.buy === "") return "Dealer publishes no buy-back price for this row";
  return null;
}

function buildRecord(source, feedRows) {
  const find = label => feedRows.find(r => r.label === label) || null;
  const rows = source.rows.map((cfg, i) => {
    const cells = { buy: null, sell: null, high: null, low: null };
    if (cfg && cfg.split) {
      const b = find(cfg.buy_label), s = find(cfg.sell_label);
      cells.buy = b ? b.buy : null;
      cells.sell = s ? s.buy : null;
      if (s) { cells.high = s.high; cells.low = s.low; }
    } else if (cfg) {
      const f = find(cfg.label);
      if (f) {
        Object.assign(cells, { buy: f.buy, sell: f.sell, high: f.high, low: f.low });
        if (cfg.sell_col === 3) [cells.buy, cells.sell] = [cells.sell, cells.buy];
      }
    }
    return Object.assign({ label: CANONICAL_LABELS[i] }, cells, { note: rowNote(source, cfg, cells) });
  });

  // Badla Bhaw: Cash / RTGS sell minus Gold Future MCX buy.
  const f0 = toInt(rows[0].buy), s1 = toInt(rows[1].sell), s2 = toInt(rows[2].sell);
  return {
    source: source.id, name: source.name, site_url: source.site_url,
    rows, all_rows: feedRows,
    diff1: f0 !== null && s1 !== null ? s1 - f0 : null,
    diff2: f0 !== null && s2 !== null ? s2 - f0 : null,
  };
}

// Bumped on every start/stop; a tick from an older run sees the mismatch and
// ends its loop, so stopping is immediate and a restart never doubles up.
let directRun = 0;
let directOn = false;
const directState = new Map();   // source id -> {signature, last}

function startDirect() {
  if (directOn) return;
  directOn = true;
  const run = ++directRun;
  transport = "direct";
  paintStatus();
  DIRECT_SOURCES.forEach(source => {
    const state = directState.get(source.id) || { signature: null, last: null };
    directState.set(source.id, state);
    const tick = async () => {
      if (run !== directRun) return;
      const started = Date.now();
      try {
        const res = await fetch(source.url + "?t=" + started, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rec = buildRecord(source, parseFeed(await res.text()));
        if (run !== directRun) return;   // the socket took over mid-request
        const now = new Date().toISOString();
        const sig = JSON.stringify([rec.rows, rec.all_rows]);
        rec.timestamp = now;
        rec.changed_at = sig !== state.signature || !state.last ? now : state.last.changed_at;
        rec.ok = true;
        state.signature = sig;
        state.last = rec;
        applyRecord(rec);
        paintStatus();
      } catch (e) {
        if (run !== directRun) return;
        // Mark the card offline but keep the newest numbers on screen (they
        // may have come from the socket since this run's state.last).
        const card = cards.get(source.id);
        const base = card ? card.record : state.last;
        if (base) applyRecord(Object.assign({}, base, { ok: false, error: String(e) }));
      }
      setTimeout(tick, Math.max(0, DIRECT_MS - (Date.now() - started)));
    };
    tick();
  });
}

function stopDirect() {
  directOn = false;
  directRun++;
}

// ---- transport: WebSocket push when we can get it, polling otherwise ----

let socket = null;
let pollTimer = null;
let retryMs = 1000;
let everOpened = false;
let lastFrameAt = 0;
let serverHeartbeats = false;   // local_server.py sends {"type":"heartbeat"} every 20s

// A socket that opens but then silently stops delivering (stalled proxy,
// sleeping laptop) would freeze the numbers. local_server.py heartbeats every
// 20s, so 60s of silence from it means the socket is dead: drop and reconnect.
const SILENT_SOCKET_MS = 60000;
// API Gateway idles a socket out after 10 minutes without client traffic.
const CLIENT_PING_MS = 4 * 60 * 1000;

function startPolling() {
  transport = "poll";
  if (pollTimer === null) {
    load();
    pollTimer = setInterval(load, POLL_MS);
  }
  paintStatus();
}

// What keeps the numbers moving while the socket is down: localhost polls the
// server's /api (that's how --dynamo mode works), anywhere else the browser
// goes straight to the dealers.
function fallback() {
  if (IS_LOCAL) startPolling();
  else startDirect();
}

function stopPolling() {
  if (pollTimer !== null) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function handleMessage(msg) {
  // Shapes we accept: a bare array (/api, local and deployed), the snapshot
  // sent on connect, a single-dealer update (local_server, one thread per
  // dealer), and a batch of dealers (the Lambda, which polls them together).
  if (Array.isArray(msg)) { render(msg); return; }
  if (msg.type === "heartbeat") { serverHeartbeats = true; return; }
  if (msg.type === "pong") return;
  if (msg.type === "snapshot") { render(msg.sources || []); return; }
  if (msg.type === "update") {
    const list = msg.sources || (msg.source ? [msg.source] : []);
    list.forEach(applyRecord);
    paintStatus();
  }
}

function connect() {
  if (!WS_URL) { fallback(); return; }

  let ws;
  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    fallback();
    scheduleReconnect();
    return;
  }
  socket = ws;

  ws.onopen = () => {
    if (socket !== ws) return;
    everOpened = true;
    retryMs = 1000;
    lastFrameAt = Date.now();
    stopPolling();          // the server pushes now; no need to ask
    stopDirect();
    transport = "ws";
    paintStatus();
    // local_server.py pushes a snapshot on connect by itself; API Gateway has
    // to be asked for one, since $connect can't send before the handshake ends.
    try { ws.send(JSON.stringify({ action: "snapshot" })); } catch (e) { /* no-op */ }
  };

  ws.onmessage = (ev) => {
    if (socket !== ws) return;
    lastFrameAt = Date.now();
    try {
      handleMessage(JSON.parse(ev.data));
    } catch (e) {
      /* ignore a malformed frame and wait for the next push */
    }
  };

  ws.onclose = () => {
    if (socket !== ws) return;   // an older socket we already replaced
    socket = null;
    fallback();             // keep the numbers moving while we reconnect
    scheduleReconnect();
  };

  ws.onerror = () => {
    try { ws.close(); } catch (e) { /* onclose handles the rest */ }
  };
}

function scheduleReconnect() {
  setTimeout(connect, retryMs);
  // A host that has never accepted the socket (plain static hosting) is
  // re-tried slowly; one that dropped a working socket is re-tried quickly.
  retryMs = Math.min(retryMs * 2, everOpened ? 15000 : 60000);
}

// Give up on the current socket right now: fall back first, then close it.
// Waiting for onclose would leave the numbers frozen while a dead peer sits
// in CLOSING (browsers wait up to 60s for the close handshake).
function dropSocket() {
  const dead = socket;
  socket = null;
  try { dead.close(); } catch (e) { /* already gone */ }
  fallback();
  scheduleReconnect();
}

function socketIsSilent() {
  return serverHeartbeats && socket && socket.readyState === WebSocket.OPEN &&
         Date.now() - lastFrameAt > SILENT_SOCKET_MS;
}

setInterval(() => { if (socketIsSilent()) dropSocket(); }, 5000);

setInterval(() => {
  if (socket && socket.readyState === WebSocket.OPEN) {
    try { socket.send(JSON.stringify({ action: "ping" })); } catch (e) { /* onclose handles it */ }
  }
}, CLIENT_PING_MS);

// A tab coming back from sleep may hold a socket that died while it slept.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && socketIsSilent()) dropSocket();
});

document.getElementById("refresh").addEventListener("click", load);
paintStatus();
connect();
</script>

</body>
</html>

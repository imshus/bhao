<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Rate API</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: Canvas; color: CanvasText;
         font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
  pre { margin: 0; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<pre id="out">Connecting…</pre>
<script>
// /api or /api/stream opened in a browser tab gets this page: ONE JSON
// document - exactly what /api returns - updated in place. Every event on
// /api/stream is that complete JSON, so each one simply replaces the last.
// /api/3min and /api/3min/stream do the same with the /api/3min JSON, which
// changes once every 3 minutes. Scripts and apps still get raw JSON
// (local_server.py decides by the Accept header; ?raw forces raw output).
const out = document.getElementById("out");
const SILENT_MS = 60000;            // the server heartbeats every 20s
const STREAM_URL = /^\/+api\/+3min/.test(location.pathname) ? "/api/3min/stream" : "/api/stream";

let last = "";
let lastEventAt = Date.now();
let stream = null;

function onData(ev) {
  lastEventAt = Date.now();
  let data;
  try { data = JSON.parse(ev.data); } catch (e) { return; }
  const text = JSON.stringify(data, null, 2);
  // Don't wipe out text the user is selecting to copy.
  if (text !== last && !String(window.getSelection())) {
    last = text;
    out.textContent = text;
  }
}

function openStream() {
  if (stream) stream.close();
  lastEventAt = Date.now();
  stream = new EventSource(STREAM_URL);
  stream.onmessage = onData;        // EventSource reconnects by itself on errors
  stream.addEventListener("heartbeat", () => { lastEventAt = Date.now(); });
}

// A stream that stays open but goes silent (stalled proxy, laptop sleep) is
// reopened, so the tab can't sit on stale numbers.
setInterval(() => { if (Date.now() - lastEventAt > SILENT_MS) openStream(); }, 5000);

openStream();
</script>
</body>
</html>
